  const SEG = [['up', '#2f9e44', 'Online'], ['warn', '#f08c00', 'Online, tjänst nere'], ['down', '#e03131', 'Svarar inte'], ['seen', '#8ce99a', 'Sedd vid skanning'], ['unseen', '#adb5bd', 'Ej sedd vid skanning'], ['none', 'var(--surface3)', 'Ingen status']];
  let off = 0; const tot = ds.length || 1;
  const segs = SEG.filter(([k]) => st[k]).map(([k, c]) => { const p = st[k] / tot * 100, x = `<circle cx="21" cy="21" r="15.915" fill="none" style="stroke:${c}" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${25 - off}"/>`; off += p; return x; }).join('');
  const live = liveOn && LIVE, up = st.up + st.warn;
  const center = live ? `<b>${up}<small>/${up + st.down}</small></b><span>svarar</span>` : db.scan ? `<b>${st.seen}<small>/${st.seen + st.unseen}</small></b><span>sedda</span>` : '<b>–</b><span>ingen status</span>';
  const downs = ds.filter(d => liveOf(d) === false);
  const cStat = `<div class="card"><div class="ch"><h3>Status</h3>${liveOn ? '<span class="tag ok">● Live</span>' : '<button class="lnk" data-dash="live">Slå på Live</button>'}</div>
    <div class="donutw"><div class="donut"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.915" fill="none" style="stroke:var(--surface2)" stroke-width="5"/>${segs}</svg><div class="dc">${center}</div></div>
      <div class="legend">${SEG.filter(([k]) => st[k]).map(([k, c, l]) => `<div class="lg"><i style="background:${c}"></i>${l}<b>${st[k]}</b></div>`).join('') || '<p class="hint">Inga enheter.</p>'}</div></div>
    ${downs.length ? '<div class="dsub">Svarar inte</div>' + downs.slice(0, 6).map(d => `<div class="row" data-go="${d.id}"><span class="jdot down"></span><b class="tx">${nm(d)}</b><span class="hint mono">${esc(d.ip || '')}</span></div>`).join('') + (downs.length > 6 ? `<p class="hint">+ ${downs.length - 6} till</p>` : '') : ''}
    <p class="hint" style="margin-bottom:0">${db.scan ? `Senaste skanning ${rel(db.scan.at)} · ${db.scan.hosts.length} svarade` : 'Ingen nätverksskanning gjord ännu'} · <span class="lk" data-nav="scan">Skanna</span></p></div>`;

  dashTodos = todos();
  const TC = {high:['#e03131', 'viktiga'], med:['#f08c00', 'bör åtgärdas'], low:['#868e96', 'info']};
  const cTodo = `<div class="card"><div class="ch"><h3>Att göra</h3><button class="lnk" data-nav="todo">Visa alla →</button></div>
    <div class="sevs">${['high', 'med', 'low'].map(k => `<div class="sev" data-nav="todo"><b style="color:${TC[k][0]}">${dashTodos.filter(t => t.sev === k).length}</b><span>${TC[k][1]}</span></div>`).join('')}</div>
    ${dashTodos.slice(0, 5).map((t, i) => `<div class="row td" data-dtodo="${i}"><span class="sv" style="background:${TC[t.sev][0]}"></span><div class="tx">${t.text}</div></div>`).join('') || '<p class="hint">Inget att åtgärda just nu. 🎉</p>'}</div>`;

  const thumbs = plans.map(P => {
    const b = fitBounds(P), r = R(P), pd = db.devices.filter(d => d.planId === P.id);
    return `<button class="pthumb" data-dplan="${P.id}" title="Öppna ${esc(P.name)} på kartan"><svg viewBox="${b.x} ${b.y} ${b.w} ${b.h}" preserveAspectRatio="xMidYMid meet"><rect class="paper" width="${P.w}" height="${P.h}"/>${P.bg ? `<image href="${P.bg}" width="${P.w}" height="${P.h}"/>` : ''}${P.rooms.map(rm => `<rect class="tr" x="${rm.x}" y="${rm.y}" width="${rm.w}" height="${rm.h}" rx="${r * .2}" stroke-width="${r * .12}"/>`).join('')}${pd.map(d => `<circle cx="${d.x}" cy="${d.y}" r="${r * .95}" fill="${T(d.type).c}" stroke="#fff" stroke-width="${r * .2}"/>`).join('')}</svg><span class="pl"><b>${esc(P.name)}</b><span>${pd.length} enheter · ${P.rooms.length} rum</span></span></button>`;
  }).join('');
  const cPlans = `<div class="card c2"><div class="ch"><h3>Planer · ${esc(S.name)}</h3><button class="lnk" data-nav="map">Öppna kartan →</button></div><div class="thumbs">${thumbs}</div></div>`;

  const cJobs = `<div class="card"><div class="ch"><h3>Rutiner &amp; jobb</h3><button class="lnk" data-nav="jobs">Visa alla →</button></div>${jobsOverview()}</div>`;

  const L = lics().map(x => [x, licDays(x)]).filter(([, dd]) => dd != null).sort((a, b) => a[1] - b[1]).slice(0, 5);
  const yr = lics().reduce((n, x) => n + licYear(x), 0);
  const cLic = `<div class="card"><div class="ch"><h3>Avtal &amp; licenser</h3><button class="lnk" data-nav="lic">Visa alla →</button></div>
    ${L.map(([x, dd]) => `<div class="row" data-dlic="${x.id}"><div class="tx"><b>${esc(x.name || LIC_KINDS[x.kind] || '(namnlös)')}</b><div class="hint">${esc(LIC_KINDS[x.kind] || '')}${x.vendor ? ' · ' + esc(x.vendor) : ''}</div></div><span class="${dd < 0 ? 'bad' : dd <= (+x.notice || 30) ? 'warnc' : 'hint'}">${dd < 0 ? 'gick ut' : dd === 0 ? 'i dag' : 'om ' + dd + ' d'}</span></div>`).join('')
      || `<p class="hint">${lics().length ? 'Inga avtal med förnyelsedatum.' : 'Inga avtal inlagda.'} <span class="lk" data-nav="lic">Lägg till</span></p>`}
    ${yr ? `<p class="hint" style="margin-bottom:0">Löpande kostnad ca <b>${Math.round(yr).toLocaleString('sv-SE')} kr/år</b></p>` : ''}</div>`;

  const sh = ds.filter(d => isShelly(d) && d.shelly && !d.shelly.err && now - d.shelly.t < 15 * 60e3 && d.shelly.power != null).sort((a, b) => b.shelly.power - a.shelly.power);
  const cPow = sh.length ? `<div class="card"><div class="ch"><h3>Effekt just nu</h3><span class="hint">Shelly</span></div>
    ${sh.slice(0, 6).map(d => `<div class="row" data-go="${d.id}"><b class="tx">${nm(d)}</b><span class="mono">${fmtW(d.shelly.power)}</span></div>`).join('')}${sh.length > 6 ? `<p class="hint">+ ${sh.length - 6} till</p>` : ''}</div>` : '';

  const evs = [
    ...(db.events || []).slice(-60).map(e => ({t:e.t, id:e.devId, html:evText(e), c:e.up ? '#2f9e44' : '#e03131'})),
    ...ds.flatMap(d => (d.log || []).slice(-8).map(l => ({t:l.t, id:d.id, html:esc(l.text), c:l.auto ? '#adb5bd' : 'var(--accent)'})))
  ].filter(e => e.t).sort((a, b) => b.t - a.t).slice(0, 8);
  const cEv = `<div class="card"><div class="ch"><h3>Senaste händelser</h3></div>
    ${evs.map(e => { const d = dev(e.id); return `<div class="row ev" ${d ? `data-go="${d.id}"` : ''}><span class="jdot" style="background:${e.c}"></span><div class="tx">${d ? '<b>' + nm(d) + '</b> · ' : ''}${e.html}<div class="hint">${rel(e.t)}</div></div></div>`; }).join('') || '<p class="hint">Inga händelser ännu.</p>'}</div>`;

  const SS = settings(), C = SS.cloud;
  const cSec = `<div class="card"><div class="ch"><h3>Säkerhet &amp; backup</h3><button class="lnk" data-nav="set">Inställningar →</button></div>
    <div class="kv"><span>Hjälpprogram</span><b class="${HELPER ? 'ok' : 'bad'}">${HELPER ? 'anslutet' : 'körs inte'}</b></div>
    ${onServer() && HELPER?.login2fa && HELPER.login2fa.mode !== 'off' ? `<div class="kv"><span>Tvåstegsinloggning (server)</span><b class="${HELPER.login2fa.enrolled ? 'ok' : 'warnc'}">${HELPER.login2fa.enrolled ? 'aktiverad' : 'av – rekommenderas'}</b></div>` : ''}
    <div class="kv"><span>${onServer() ? 'Tvåstegsskydd av valvet' : 'Tvåstegsinloggning'}</span><b class="${MFA ? 'ok' : ''}">${MFA ? 'aktiverad' : 'av'}</b></div>
    <div class="kv"><span>Senaste säkerhetskopia</span><b>${SS.lastBackup ? rel(SS.lastBackup) : 'ingen ännu'}</b></div>
    <div class="kv"><span>Molnbackup</span><b>${C?.type ? (C.lastErr ? '<span class="bad">misslyckades</span>' : C.last ? rel(C.last) : 'inställd') : 'inte inställd'}</b></div>
    <div class="kv"><span>${onServer() ? 'Lagring på servern' : 'Lagring i webbläsaren'}</span><b>${storeMB().toFixed(1).replace('.', ',')} MB${onServer() ? '' : ' av ca 5 MB'}</b></div>
    <div class="kv"><span>Autolås</span><b>efter ${AUTOLOCK_MIN} min</b></div></div>`;

  el.innerHTML = `<div class="dhead"><h2>Översikt</h2><div class="hint">${esc(S.name)} · ${ds.length} enheter · ${plans.length} ${plans.length === 1 ? 'plan' : 'planer'} · ${rooms} rum</div></div>
    <div class="dgrid">${cDev}${cStat}${cTodo}${cPlans}${cJobs}${cLic}${cPow}${cEv}${cSec}</div>`;
}

/* ---------- UI-händelser ---------- */
function initUI(){
  detectHelper().then(() => { try{ if(localStorage.getItem('itinv.ui.live') === '1') setLive(true); }catch{} renderLive(); renderTodoBadge(); maybeBackup(); setTimeout(maintTick, 4000); });
  setInterval(maintTick, 5 * 60e3);
  setInterval(maybeBackup, 36e5);
  $('#btnScan').onclick = openScan;
  $('#btnJobs').onclick = () => openJobs();
  $('#btnLic').onclick = () => openG('lic');
  $('#btnLive').onclick = () => setLive(!liveOn);
  $('#btnTodo').onclick = () => openG('todo');
  $('#btnIp').onclick = () => openG('ip');
  $('#btnSettings').onclick = () => openG('set');
  $('#btnPrint').onclick = printAll;
  document.querySelectorAll('#nav [data-nav="dash"],#nav [data-nav="map"],#nav [data-nav="devices"]').forEach(b => b.onclick = () => setView(b.dataset.nav));
  $('#btnNavMin').onclick = () => lsSet('itinv.ui.navmin', document.body.classList.toggle('navmin') ? '1' : '');
  $('#btnList').classList.toggle('on', !document.body.classList.contains('nolist'));
  $('#btnList').onclick = () => { const off = document.body.classList.toggle('nolist'); lsSet('itinv.ui.list', off ? '0' : '1'); $('#btnList').classList.toggle('on', !off); };
  $('#vDash').addEventListener('click', e => {
    const t = e.target.closest('[data-nav],[data-go],[data-jopen],[data-act],[data-dq],[data-dtodo],[data-dplan],[data-dlic],[data-dash]'); if(!t) return;
    const D = t.dataset;
    if(D.nav) navTo(D.nav);
    else if(D.go) gotoDev(D.go);
    else if(D.jopen) openJobs({edit:D.jopen});
    else if(D.act === 'openjobs') openJobs();
    else if(D.dq !== undefined){ $('#search').value = D.dq; setView('devices'); renderList(); renderLayers(); }
    else if(D.dtodo !== undefined){ const x = dashTodos[+D.dtodo]; if(x?.go) todoGo(x.go); else openG('todo'); }
    else if(D.dplan){ cur.plan = D.dplan; cur.sel = null; setView('map', {keepPlan:true}); renderAll(); fitView(); }
    else if(D.dlic){ licEdit = D.dlic; openG('lic'); }
    else if(D.dash === 'live') setLive(true);
  });
  $('#vDevices').addEventListener('click', e => {
    const m = e.target.closest('[data-dmap]'); if(m){ gotoDev(m.dataset.dmap); return; }
    const h = e.target.closest('th[data-sort]');
    if(h){ const k = h.dataset.sort; devSort = devSort?.k === k ? {k, dir:-devSort.dir} : {k, dir:1}; lsSet('itinv.ui.dsort', JSON.stringify(devSort)); renderDevTable(); return; }
    const b = e.target.closest('[data-dv]');
    if(b){ const v = b.dataset.dv; if(v === 'add'){ setView('map'); setMode('place'); } else if(v === 'csv') $('#btnCsv').click(); else if(v === 'scan') openScan(); return; }
    const r = e.target.closest('tr[data-dsel]'); if(r) selectFromTable(r.dataset.dsel);
  });
  const chipClick = e => {
    const c = e.target.closest('[data-chip]'); if(!c) return;
    const tok = c.dataset.chip, sb = $('#search'), w = sb.value.trim().split(/\s+/).filter(Boolean);
    const i = w.map(x => x.toLowerCase()).indexOf(tok);
    if(i >= 0) w.splice(i, 1); else w.push(tok);
    sb.value = w.join(' '); renderList(); renderLayers();
  };
  document.querySelectorAll('[data-chips]').forEach(el => el.onclick = chipClick);
  $('#fileAttach').onchange = async e => { const d = selDev(), fl = [...e.target.files]; e.target.value = ''; if(d && fl.length) await addFiles(d, fl); };
  const pn = $('#panel');
  pn.addEventListener('dragover', e => { if(selDev() && e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
  pn.addEventListener('drop', e => { const d = selDev(); if(!d || !e.dataTransfer?.files?.length) return; e.preventDefault(); addFiles(d, [...e.dataTransfer.files]); });
  const gd = $('#gDlg');
  gd.addEventListener('click', async e => {
    const t = e.target.closest('[data-g],[data-ipgo]'); if(!t) return;
    if(t.dataset.ipgo !== undefined){ const id = t.dataset.ipgo; closeG(); if(id === 'scan') openScan(); else gotoDev(id); return; }
    const g = t.dataset.g;
    if(g === 'close') closeG();
    else if(g === 'back'){ const b = gBack; if(b) navTo(b); else closeG(); }
    else if(g === 'go'){
      const go = gTodos[+t.dataset.i]?.go; if(!go) return;
      if(go.dev){ closeG(); gotoDev(go.dev); } else if(go.job){ closeG(); openJobs({edit:go.job}); }
      else if(go.scan){ closeG(); openScan(); } else if(go.set) openG('set'); else if(go.ip) openG('ip'); else if(go.lic){ licEdit = go.lic; openG('lic'); }
    }
    else if(g === 'ign'){ const x = gTodos[+t.dataset.i]; if(!x) return; (db.ignored = db.ignored || {})[x.key] = Date.now() + 30 * 864e5; save(); renderG(); renderTodoBadge(); }
    else if(g === 'unign'){ db.ignored = {}; save(); renderG(); renderTodoBadge(); }
    else if(g === 'godev'){ closeG(); gotoDev(t.dataset.id); }
    else if(g === 'backup'){ t.disabled = true; t.textContent = 'Sparar…'; await doBackup(true); renderG(); }
    else if(g === 'restore') restoreBackup(t.dataset.name);
    else if(g === 'notifyperm'){ try{ await Notification.requestPermission(); }catch{} renderG(); }
    else if(g === 'testnotify'){ try{ new Notification('NetAtlas', {body:'Testnotis – notiser fungerar!'}); }catch(err){ alert(err.message); } }
    else if(g === 'print') printAll();
    else if(g === 'usefolder'){ settings().backupDir = t.dataset.path; lsSet('itinv.ui.bkdir', t.dataset.path); save(); gBackups = null; renderG(); loadBackups(); }
    else if(g === 'ctest'){ t.disabled = true; try{ const r = await cloudCall('test'); alert(`Anslutningen fungerar ✔\n${r.count} NetAtlas-kopior finns i molnet.`); }catch(err){ alert('Anslutningen misslyckades:\n' + err.message); } renderG(); }
    else if(g === 'cput'){ t.disabled = true; t.textContent = 'Laddar upp…'; try{ const r = await cloudUpload(JSON.stringify(await encryptDb(db, key, salt))); status(`Uppladdad till molnet: ${r.file}`); gCloud = null; }catch(err){ alert('Uppladdningen misslyckades:\n' + err.message); } renderG(); }
    else if(g === 'clist'){ t.disabled = true; try{ gCloud = await cloudCall('list'); }catch(err){ gCloud = {err:err.message}; } renderG(); }
    else if(g === 'crestore'){ try{ const v = await cloudCall('get', {name:t.dataset.name}); closeG(); await importVault(v, t.dataset.name); }catch(err){ alert('Kunde inte hämta kopian:\n' + err.message); } }
    else if(g === 'hint'){ const h = prompt('Ledtråd för huvudlösenordet (visas på inloggningsrutan – skriv inte själva lösenordet):', hintGet()); if(h !== null){ hintSet(h.trim()); status(h.trim() ? 'Ledtråd sparad' : 'Ledtråd borttagen'); } }
    else if(g === 'reset') resetAll();
    else if(g === 'ack'){ const x = (db.known || {})[t.dataset.k]; if(x){ x.ack = true; save(); renderG(); renderTodoBadge(); } }
    else if(g === 'knownack'){ Object.values(db.known || {}).forEach(x => x.ack = true); save(); renderG(); renderTodoBadge(); }
    else if(g === 'knownreset'){ if(confirm('Nollställa utgångsläget? Nästa skanning sparas som nytt utgångsläge.')){ db.known = {}; save(); renderG(); renderTodoBadge(); } }
    else if(g === 'hafetch') haFetch();
    else if(g === 'haimport') haDoImport();
    else if(g === 'mobile') openG('mobile');
    else if(g === 'mobbuild'){
      const M = mob || (mob = {}), pw = $('#mpw').value;
      if(pw.length < 8){ M.err = 'Lösenordet måste ha minst 8 tecken.'; renderG(); return; }
      if(pw !== $('#mpw2').value){ M.err = 'Lösenorden matchar inte.'; renderG(); return; }
      M.img = $('#mimg').checked; M.busy = true; M.err = ''; M.share = null; renderG();
      try{ M.html = await buildMobile(pw, M.img); }catch(err){ M.err = err.message; }
      M.busy = false; renderG();
    }
    else if(g === 'mobdl'){ download('netatlas-mobil.html', mob.html, 'text/html'); status('Mobilkopian sparad i Hämtade filer'); }
    else if(g === 'mobsave'){ try{ const r = await apiPost('/api/mobile/save', {html:mob.html, dir:t.dataset.path}); alert('Sparad:\n' + r.path); }catch(err){ alert(err.message); } }
    else if(g === 'mobshare'){
      t.disabled = true;
      try{ const r = await apiPost('/api/mobile/share', {html:mob.html, minutes:15}); mob.share = r; mob.qr = await qrSvg(r.urls[0] || ''); }catch(err){ mob.err = err.message; }
      renderG();
    }
    else if(g === 'mobstop'){ try{ await apiPost('/api/mobile/stop', {}); }catch{} mob.share = null; renderG(); status('Delningen stoppad'); }
    else if(g === 'mfaon') mfaStart();
    else if(g === 'mfaconfirm') mfaConfirm(t);
    else if(g === 'mfaoff') mfaOff();
    else if(g === 'l2faon'){
      try{ const r = await apiPost('/api/login2fa/setup', {}); l2fa = {...r, qr:await qrSvg(r.uri), err:''}; renderG(); setTimeout(() => $('#l2faCode')?.focus(), 50); }
      catch(err){ alert('Kunde inte starta: ' + err.message); }
    }
    else if(g === 'l2faconfirm'){
      t.disabled = true;
      try{ await apiPost('/api/login2fa/confirm', {token:l2fa.token, code:$('#l2faCode').value}); l2fa = null; await detectHelper(); renderG(); renderTodoBadge(); status('Tvåstegsinloggning till servern aktiverad'); }
      catch(err){ l2fa.err = err.message; renderG(); setTimeout(() => $('#l2faCode')?.focus(), 50); }
    }
    else if(g === 'l2facancel'){ l2fa = null; renderG(); }
    else if(g === 'l2faoff'){
      const code = prompt('Ange koden från autentiseringsappen för att stänga av tvåstegsinloggningen till servern:');
      if(!code) return;
      try{ await apiPost('/api/login2fa/disable', {code}); await detectHelper(); renderG(); renderTodoBadge(); status('Tvåstegsinloggning till servern avstängd'); }
      catch(err){ alert(err.message); }
    }
    else if(g === 'mfareccopy') copyText(mfaS.recovery, true);
    else if(g === 'mfarecdl') download('netatlas-aterstallningsnyckel.txt', mfaRecText(), 'text/plain');
    else if(g === 'mfarecprint'){ const w = window.open('', '_blank'); if(w){ w.document.write(`<pre style="font:16px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;padding:24px">${esc(mfaRecText())}</pre>`); w.document.close(); setTimeout(() => w.print(), 300); } }
    else if(g === 'licnew'){ licEdit = newLic().id; renderG(); $('#lcName')?.focus(); }
    else if(g === 'licedit'){ licEdit = t.dataset.id; renderG(); $('#gdBody').scrollTop = 0; }
    else if(g === 'licdone'){ licEdit = null; renderG(); renderTodoBadge(); }
    else if(g === 'licdel'){ const x = lics().find(y => y.id === licEdit); if(x && confirm(`Ta bort "${x.name || 'posten'}"?`)){ db.licenses = lics().filter(y => y !== x); licEdit = null; save(); renderG(); renderTodoBadge(); } }
    else if(g === 'lickeyshow'){ const i = $('#lcKey'); if(i) i.type = i.type === 'password' ? 'text' : 'password'; }
    else if(g === 'lickeycopy'){ const x = lics().find(y => y.id === licEdit); if(x?.key) copyText(x.key, true); }
    else if(g === 'liccert'){ const x = lics().find(y => y.id === licEdit); if(!x?.host){ alert('Ange värdnamnet först.'); return; } if(!HELPER){ alert('Kräver hjälpprogrammet.'); return; } t.disabled = true; t.textContent = '…'; try{ await licCheckCert(x); }catch(err){ alert('Kunde inte kontrollera certifikatet: ' + err.message); } renderG(); renderTodoBadge(); }
    else if(g === 'hibp'){ t.disabled = true; t.textContent = 'Kontrollerar…'; try{ const r = await hibpCheckAll(); if(r) alert(r.found ? `${r.found} av ${r.checked} lösenord finns i kända dataläckor. De visas under ⚠ Att göra.` : `Inget av ${r.checked} lösenord finns i kända dataläckor. 👍`); }catch(err){ alert('Kontrollen misslyckades: ' + err.message); } renderG(); }
    else if(g === 'ctadd'){ (settings().types = customTypes().slice()).push({k:'c' + uid(), l:'Ny typ', a:'NY', c:'#5c7cfa'}); save(); renderG(); renderPlaceType(); }
    else if(g === 'ctdel'){
      const k = t.dataset.k, n = db.devices.filter(d => d.type === k).length;
      if(n && !confirm(`${n} enheter använder typen. De blir "Övrigt". Fortsätta?`)) return;
      db.devices.forEach(d => { if(d.type === k) d.type = 'other'; }); settings().types = customTypes().filter(x => x.k !== k); save(); renderG(); renderPlaceType(); renderLayers(); renderList();
    }
    else if(g === 'trrest'){ restoreTrash(t.dataset.id); renderG(); }
    else if(g === 'trdel'){ const x = (db.trash||[]).find(y => y.id === t.dataset.id); if(x && confirm(`Radera "${x.name}" permanent? Det går inte att ångra.`)){ eraseTrash([x]); renderG(); } }
    else if(g === 'trempty'){ if((db.trash||[]).length && confirm(`Radera allt i papperskorgen (${db.trash.length} st) permanent?`)){ eraseTrash(db.trash.slice()); renderG(); } }
    else if(['export','import','csv','pw'].includes(g)){ if(g === 'import') closeG(); $({export:'#btnExport', import:'#btnImport', csv:'#btnCsv', pw:'#btnPw'}[g]).click(); }
  });
  gd.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.gin === 'net'){ ipNet = t.value; renderG(); return; }

      case 'openurl': if(d?.url){ const u=/^https?:\/\//i.test(d.url)?d.url:'http://'+d.url; window.open(u,'_blank','noopener'); } break;
      case 'dup': {
        const c = JSON.parse(JSON.stringify(d)); c.id=uid(); c.name=(d.name||'')+' (kopia)'; c.x+=R(P)*3; c.y+=R(P)*1; c.updated=Date.now();
        c.accounts.forEach(x=>x.id=uid()); c.ip=''; c.mac=''; c.serial=''; c.log=[]; c.files=[]; delete c.shelly; delete c.monData;
        logAdd(c, `Kopierad från ${d.name || 'enhet'}`);
        (c.services||[]).forEach(s => { s.id=uid(); s.host=''; (s.accounts||[]).forEach(x=>x.id=uid()); });
        db.devices.push(c); save(); select({kind:'dev',id:c.id}); break; }
      case 'addacc': {
        const owner = svc || d;
        owner.accounts = owner.accounts || [];
        const na = {id:uid(), label:'', user:'', pass:'', hint:''};
        owner.accounts.push(na); openAccs.add(na.id); if(!svc){ openSecs.add('accts'); saveSecs(); }
        d.updated=Date.now(); save(); renderPanel();
        (svc ? panel.querySelector(`[data-svc="${svc.id}"] .accts .acct:last-child input`) : panel.querySelector('#accts .acct:last-child input'))?.focus();
        break; }
      case 'delacc': if(confirm(`Ta bort kontot "${a.user||a.label||''}"?`)){ accList.splice(accList.indexOf(a), 1); logAdd(d, `Konto borttaget: ${a.user || a.label || 'konto'}`); d.updated=Date.now(); save(); renderPanel(); } break;
      case 'addsvc': {
        const s = newSvc(b.dataset.kind);
        d.services = d.services || []; d.services.push(s); openSvcs.add(s.id); openSecs.add('svcs'); saveSecs(); d.updated=Date.now(); save(); renderPanel(); renderList();
        panel.querySelector(`[data-svc="${s.id}"] [data-sf="name"]`)?.focus();
        break; }
      case 'delsvc':
        if(confirm(`Ta bort "${svc.name||SV(svc.kind).l}" och dess ${svc.accounts?.length||0} konton?`)){ d.services = d.services.filter(x=>x!==svc); logAdd(d, `Tjänst borttagen: ${svc.name || SV(svc.kind).l}`); d.updated=Date.now(); save(); renderPanel(); renderList(); }
        break;
      case 'opensvc': { const u = svcUrl(svc, d); if(u) window.open(/^https?:\/\//i.test(u)?u:'http://'+u, '_blank', 'noopener'); break; }
      case 'copyconn': copyText(connStr(svc, d)); break;
      case 'qa': {
        if(!HELPER){ alert('Snabbåtgärder kräver hjälpprogrammet (Start NetAtlas.bat).'); break; }
        const q = b.dataset.q, ip = (d.ip||'').trim(), user = b.dataset.user, acc = allAccs(d).find(x => x.a.user === user && x.a.pass);
        try{
          if(q === 'ssh' && acc) await copyText(acc.a.pass, true);
          const r = await apiPost('/api/action', {action:q, ip, mac:d.mac, user});
          if(q === 'ping') status(r.up ? `${ip} svarar${r.ms != null ? ` (${r.ms} ms)` : r.ports?.length ? ` på port ${r.ports.join(', ')}` : ''}` : `${ip} svarar inte`, !r.up);
          else if(q === 'wol'){ status(`Väckningspaket skickat till ${d.mac}`); logAdd(d, 'Wake-on-LAN skickat'); save(); }
          else status(q === 'ssh' ? `Öppnar SSH till ${user}@${ip}…${acc ? ' Lösenordet ligger i urklipp – högerklicka i terminalen för att klistra in.' : ''}` : `Öppnar fjärrskrivbord till ${ip}…`);
        }catch(err){ status(err.message, true); }
        break; }
      case 'haimp': openHaImport(d.id); break;
      case 'addpf': { (d.fwd = d.fwd || []).push({id:uid(), ext:'', proto:'TCP', target:'', intPort:'', desc:'', on:true}); openSecs.add('ports'); saveSecs(); save(); renderPanel(); break; }
      case 'delpf': { const id = b.closest('[data-pf2]').dataset.pf2; d.fwd = (d.fwd||[]).filter(x => x.id !== id); save(); refreshSec('ports', portsPanel(d)); renderTodoBadge(); break; }
      case 'addlog': addLogEntry(); break;
      case 'dellog': { const id = b.closest('[data-log]').dataset.log; d.log = (d.log||[]).filter(x => x.id !== id); save(); refreshSec('log', logPanel(d)); break; }
      case 'copytotp': { if(a?.totp){ const r = await totpCode(a.totp); await copyText(r.code, true); status(`2FA-kod kopierad (giltig ${r.left} s till)`); } break; }
      case 'deltotp': if(a && confirm('Ta bort 2FA-nyckeln från kontot?')){ delete a.totp; logAdd(d, `2FA-nyckel borttagen för ${a.user || a.label || 'konto'}`); save(); renderPanel(); } break;
      case 'qrtotp': {
        const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
        inp.onchange = async () => { const f = inp.files[0]; if(!f) return; try{ status('Läser QR-koden…'); await setTotpFrom(d, a, await decodeQr(f)); }catch(err){ status(err.message, true); alert(err.message); } };
        inp.click(); break; }
      case 'shnow': b.disabled = true; b.textContent = 'Hämtar…'; await shellyFetch(d); save(); renderPanel(); renderLayers(); renderTodoBadge(); break;
      case 'monnow': b.disabled = true; b.textContent = 'Hämtar…'; await monFetch(d); renderPanel(); break;
      case 'addfile': $('#fileAttach').click(); break;
      case 'openfile': case 'dlfile': case 'delfile': {
        const f = (d.files||[]).find(x => x.id === b.closest('[data-file]').dataset.file); if(!f) break;
        if(act === 'delfile'){ if(confirm(`Ta bort ${f.name}?`)){ try{ await api('/api/file-del?id=' + f.id); }catch{} d.files = d.files.filter(x => x !== f); save(); renderPanel(); } }
        else openFile(f, act === 'dlfile');
        break; }
      case 'openjobs': openJobs(); break;
      case 'addjob': { const j = addJob(d.id); openJobs({edit:j.id}); $('#jfName')?.focus(); break; }
      case 'importjobs': openJobs({importDev:d.id}); break;
      case 'expandall': case 'collapseall': {
        const on = act === 'expandall';
        ['info','accts','svcs','ports','shelly','mon','files','jobs','log','hist'].forEach(k => on ? openSecs.add(k) : openSecs.delete(k)); saveSecs();
        const accs = [...(d.accounts||[]), ...(d.services||[]).flatMap(x => x.accounts||[])];
        accs.forEach(x => on ? openAccs.add(x.id) : openAccs.delete(x.id));
        (d.services||[]).forEach(x => on ? openSvcs.add(x.id) : openSvcs.delete(x.id));
        renderPanel(); break; }
      case 'copyuser': copyText(a.user||''); break;
      case 'copy': if(a.pass) copyText(a.pass, true); break;
      case 'reveal': {
        const m = accEl.querySelector('.pwmask'); if(!a.pass) break;
        m.textContent = a.pass; m.classList.add('revealed');
        clearTimeout(m._t); m._t = setTimeout(()=>{ m.innerHTML=mask(a.pass); m.classList.remove('revealed'); }, 8000); break; }
      case 'edit': {
        const inp = accEl.querySelector('[data-af="pass"]'), m = accEl.querySelector('.pwmask');
        inp.hidden=false; m.hidden=true; inp.focus(); inp.select(); break; }
      case 'gen':
        if(a.pass && !confirm('Ersätta befintligt lösenord med ett nytt genererat?')) break;
        a.pass = genPw(); a.changed = Date.now(); delete a.pwned; logAdd(d, `Nytt lösenord genererat för ${a.user || a.label || 'konto'}`); d.updated = Date.now(); save(); renderPanel(); status('Nytt lösenord genererat – kom ihåg att sätta det på enheten'); break;
    }
  });

  /* Planritning: pekare */
  const s = svg();
  s.addEventListener('wheel', e => {
    e.preventDefault();
    const p = pt(e), f = e.deltaY > 0 ? 1.15 : 1/1.15, v = cur.view;
    v.x = p.x-(p.x-v.x)*f; v.y = p.y-(p.y-v.y)*f; v.w*=f; v.h*=f; applyView();
  }, {passive:false});
  s.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    const p = pt(e), P = plan();
    const dEl = e.target.closest('[data-dev]'), rEl = e.target.closest('[data-room]'), hEl = e.target.closest('[data-handle]');
    const cEl = e.target.closest('[data-camhandle]');
    if(cur.mode === 'place'){ addDevice($('#placeType').value, p, cur.pendingHost); setMode('select'); return; }
    if(cur.mode === 'room'){
      drag = {kind:'newroom', x0:p.x, y0:p.y};
      $('#tmpLayer').innerHTML = `<g class="room sel"><rect class="r" x="${p.x}" y="${p.y}" width="0" height="0" stroke-width="${R(P)*.12}"/></g>`;
    } else if(cEl){
      drag = {kind:'cam', d:dev(cEl.dataset.camhandle)};
    } else if(hEl){
      const rm = P.rooms.find(r=>r.id===hEl.dataset.handle); drag = {kind:'resize', rm, ox:p.x-(rm.x+rm.w), oy:p.y-(rm.y+rm.h)};
    } else if(dEl){
      const d = dev(dEl.dataset.dev);
      if(cur.sel?.id !== d.id) select({kind:'dev', id:d.id});
      drag = {kind:'dev', d, dx:p.x-d.x, dy:p.y-d.y};
    } else if(rEl){
      const rm = P.rooms.find(r=>r.id===rEl.dataset.room);
      if(cur.sel?.id !== rm.id) select({kind:'room', id:rm.id});
      // flytta även enheterna som står i rummet
      const inside = db.devices.filter(d => d.planId===P.id && roomOf(d)?.id===rm.id).map(d=>({d, x:d.x, y:d.y}));
      drag = {kind:'room', rm, sx:p.x, sy:p.y, rx:rm.x, ry:rm.y, inside};
    } else {
      if(cur.sel) select(null);
      drag = {kind:'pan', start:p}; s.classList.add('panning');
    }
    drag.moved = false;
    s.setPointerCapture(e.pointerId);
  });
  s.addEventListener('pointermove', e => {
    if(!drag) return;
    const p = pt(e);
    switch(drag.kind){
      case 'pan': { const v=cur.view; v.x -= p.x-drag.start.x; v.y -= p.y-drag.start.y; applyView(); break; }
      case 'cam': {
        const d = drag.d, dx = p.x - d.x, dy = p.y - d.y, r = R(plan());
        d.camDir = Math.round(Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
        d.camRange = Math.max(r * 1.5, Math.hypot(dx, dy));
        drag.moved = true; renderLayers();
        const sl = $('[data-cam="dir"]'); if(sl){ sl.value = d.camDir; $('#camDirV').innerHTML = camDirLbl(d.camDir); }
        const rs = $('[data-cam="range"]'); if(rs){ const v = Math.round(d.camRange / r * 10) / 10; rs.value = v; $('#camRngV').textContent = v + '×'; }
        break; }
      case 'dev': drag.d.x=p.x-drag.dx; drag.d.y=p.y-drag.dy; drag.moved=true;
        s.querySelector(`[data-dev="${drag.d.id}"]`)?.setAttribute('transform', `translate(${drag.d.x} ${drag.d.y})`); break;
      case 'room': { const dx=p.x-drag.sx, dy=p.y-drag.sy; drag.rm.x=drag.rx+dx; drag.rm.y=drag.ry+dy; drag.inside.forEach(o=>{o.d.x=o.x+dx; o.d.y=o.y+dy;}); drag.moved=true; renderLayers(); break; }
      case 'resize': { const m=R(plan()); drag.rm.w=Math.max(m*2, p.x-drag.ox-drag.rm.x); drag.rm.h=Math.max(m*2, p.y-drag.oy-drag.rm.y); drag.moved=true; renderLayers(); break; }
      case 'newroom': { const r=$('#tmpLayer rect'); r.setAttribute('x',Math.min(p.x,drag.x0)); r.setAttribute('y',Math.min(p.y,drag.y0)); r.setAttribute('width',Math.abs(p.x-drag.x0)); r.setAttribute('height',Math.abs(p.y-drag.y0)); drag.p=p; break; }
    }
  });
  const end = () => {
    if(!drag) return;
    const P = plan();
    if(drag.kind==='newroom'){
      $('#tmpLayer').innerHTML='';
      const p = drag.p, m = R(P);
      if(p && Math.abs(p.x-drag.x0)>m && Math.abs(p.y-drag.y0)>m){
        const rm = {id:uid(), x:Math.min(p.x,drag.x0), y:Math.min(p.y,drag.y0), w:Math.abs(p.x-drag.x0), h:Math.abs(p.y-drag.y0), name:`Rum ${P.rooms.length+1}`};
        P.rooms.push(rm); save(); setMode('select'); select({kind:'room', id:rm.id});
        const inp=$('#roomName'); if(inp){ inp.focus(); inp.select(); }
      }
    } else if(drag.moved){
      if(drag.d) drag.d.updated = Date.now();
      save(); renderList(); if(cur.sel) renderPanel();
    }
    s.classList.remove('panning'); drag = null;
  };
  s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end);

  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if($('#modal').hidden && (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing))){
      e.preventDefault(); if(PAGE || VIEW === 'dash') setView('devices'); const sb = $('#search'); sb.focus(); sb.select(); return;
    }
    if(e.key==='Escape'){
      if(!$('#modal').hidden) return;
      if(PAGE){ if(typing) document.activeElement.blur(); else if(gBack && !$('#gDlg').hidden) navTo(gBack); else closePage(); return; }
      if(typing) document.activeElement.blur(); else { setMode('select'); if(cur.sel) select(null); }
    }
    if((e.key==='Delete') && !typing) delSelected();
    if((e.ctrlKey || e.metaKey) && !typing && $('#modal').hidden){
      const k = e.key.toLowerCase();
      if(k === 'z' && !e.shiftKey){ e.preventDefault(); undoRedo(-1); }
      else if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); undoRedo(1); }
    }
  });

  /* Autolås */
  let last = Date.now();
  ['pointerdown','keydown','wheel'].forEach(ev => document.addEventListener(ev, ()=>last=Date.now(), {passive:true}));
  setInterval(() => { if(Date.now()-last > AUTOLOCK_MIN*60000) lock(); }, 30000);
}

document.querySelectorAll('i[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
document.body.dataset.view = VIEW;
if(lsGet('itinv.ui.navmin') === '1') document.body.classList.add('navmin');
if(lsGet('itinv.ui.list') === '0' || (!lsGet('itinv.ui.list') && innerWidth < 1400)) document.body.classList.add('nolist');
tickClock(); setInterval(tickClock, 1000);
start();
</script>
</body>
