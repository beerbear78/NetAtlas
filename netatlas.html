function cronText(e){
  e = String(e||'').trim(); if(!e) return '';
  const fixed = {'@hourly':tx('Varje timme'),'@daily':tx('Dagligen 00:00'),'@midnight':tx('Dagligen 00:00'),'@weekly':tx('Varje söndag 00:00'),'@monthly':tx('Den 1:a varje månad'),'@yearly':tx('Årligen'),'@annually':tx('Årligen'),'@reboot':tx('Vid omstart'),
    hourly:tx('Varje timme'), daily:tx('Dagligen'), weekly:tx('Varje vecka'), monthly:tx('Varje månad'), yearly:tx('Årligen'), disabled:tx('Avstängt'), start:tx('Vid start av array'), stop:tx('Vid stopp av array'), 'boot':tx('Vid uppstart'), manuellt:tx('Manuellt')}[e];
  if(fixed) return fixed;
  const p = e.split(/\s+/); if(p.length !== 5) return '';
  const [mi, h, dom, mon, dow] = p, num = x => /^\d+$/.test(x), all = (...x) => x.every(v => v === '*');
  const hm = () => `${h.padStart(2,'0')}:${mi.padStart(2,'0')}`;
  if(mi === '*' && all(h, dom, mon, dow)) return tx('Varje minut');
  if(/^\*\/\d+$/.test(mi) && all(h, dom, mon, dow)) return tx`Var ${mi.slice(2)}:e minut`;
  if(num(mi) && all(h, dom, mon, dow)) return tx`Varje timme vid :${mi.padStart(2,'0')}`;
  if(num(mi) && /^\*\/\d+$/.test(h) && all(dom, mon, dow)) return tx`Var ${h.slice(2)}:e timme vid :${mi.padStart(2,'0')}`;
  if(num(mi) && num(h) && all(dom, mon, dow)) return tx`Dagligen ${hm()}`;
  if(num(mi) && num(h) && all(dom, mon) && /^[0-7]$/.test(dow)) return tx`Varje ${DOW[+dow % 7]} ${hm()}`;
  if(num(mi) && num(h) && all(dom, mon) && /^[0-7]-[0-7]$/.test(dow)) return `${DOW[+dow[0] % 7]}–${DOW[+dow[2] % 7]} ${hm()}`;
  if(num(mi) && num(h) && all(dom, mon) && /^[0-7](,[0-7])+$/.test(dow)) return `${dow.split(',').map(x => DOW[+x % 7].slice(0,3)).join(', ')} ${hm()}`;
  if(num(mi) && num(h) && num(dom) && all(mon, dow)) return tx`Den ${dom}:e varje månad ${hm()}`;
  return '';
}

        clearTimeout(m._t); m._t = setTimeout(()=>{ m.innerHTML=mask(a.pass); m.classList.remove('revealed'); }, 8000); break; }
      case 'edit': {
        const inp = accEl.querySelector('[data-af="pass"]'), m = accEl.querySelector('.pwmask');
        inp.hidden=false; m.hidden=true; inp.focus(); inp.select(); break; }
      case 'gen':
        if(a.pass && !confirm(tx('Ersätta befintligt lösenord med ett nytt genererat?'))) break;
        a.pass = genPw(); a.changed = Date.now(); delete a.pwned; logAdd(d, tx`Nytt lösenord genererat för ${a.user || a.label || tx('konto')}`); d.updated = Date.now(); save(); renderPanel(); status(tx('Nytt lösenord genererat – kom ihåg att sätta det på enheten')); break;
    }
  });

  /* Planritning: pekare */
  const s = svg();
  s.addEventListener('wheel', e => {
    e.preventDefault();
    const p = pt(e), f = e.deltaY > 0 ? 1.15 : 1/1.15, v = cur.view;
    v.x = p.x-(p.x-v.x)*f; v.y = p.y-(p.y-v.y)*f; v.w*=f; v.h*=f; applyView();
  }, {passive:false});
  s.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    const p = pt(e), P = plan();
    const dEl = e.target.closest('[data-dev]'), rEl = e.target.closest('[data-room]'), hEl = e.target.closest('[data-handle]');
    const cEl = e.target.closest('[data-camhandle]');
    if(cur.mode === 'place'){ addDevice($('#placeType').value, p, cur.pendingHost); setMode('select'); return; }
    if(cur.mode === 'room'){
      drag = {kind:'newroom', x0:p.x, y0:p.y};
      $('#tmpLayer').innerHTML = `<g class="room sel"><rect class="r" x="${p.x}" y="${p.y}" width="0" height="0" stroke-width="${R(P)*.12}"/></g>`;
    } else if(cEl){
      drag = {kind:'cam', d:dev(cEl.dataset.camhandle)};
    } else if(hEl){
      const rm = P.rooms.find(r=>r.id===hEl.dataset.handle); drag = {kind:'resize', rm, ox:p.x-(rm.x+rm.w), oy:p.y-(rm.y+rm.h)};
    } else if(dEl){
      const d = dev(dEl.dataset.dev);
      if(cur.sel?.id !== d.id) select({kind:'dev', id:d.id});
      drag = {kind:'dev', d, dx:p.x-d.x, dy:p.y-d.y};
    } else if(rEl){
      const rm = P.rooms.find(r=>r.id===rEl.dataset.room);
      if(cur.sel?.id !== rm.id) select({kind:'room', id:rm.id});
      // flytta även enheterna som står i rummet
      const inside = db.devices.filter(d => d.planId===P.id && roomOf(d)?.id===rm.id).map(d=>({d, x:d.x, y:d.y}));
      drag = {kind:'room', rm, sx:p.x, sy:p.y, rx:rm.x, ry:rm.y, inside};
    } else {
      if(cur.sel) select(null);
      drag = {kind:'pan', start:p}; s.classList.add('panning');
    }
    drag.moved = false;
    s.setPointerCapture(e.pointerId);
  });
  s.addEventListener('pointermove', e => {
    if(!drag) return;
    const p = pt(e);
    switch(drag.kind){
      case 'pan': { const v=cur.view; v.x -= p.x-drag.start.x; v.y -= p.y-drag.start.y; applyView(); break; }
      case 'cam': {
        const d = drag.d, dx = p.x - d.x, dy = p.y - d.y, r = R(plan());
        d.camDir = Math.round(Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
        d.camRange = Math.max(r * 1.5, Math.hypot(dx, dy));
        drag.moved = true; renderLayers();
        const sl = $('[data-cam="dir"]'); if(sl){ sl.value = d.camDir; $('#camDirV').innerHTML = camDirLbl(d.camDir); }
        const rs = $('[data-cam="range"]'); if(rs){ const v = Math.round(d.camRange / r * 10) / 10; rs.value = v; $('#camRngV').textContent = v + '×'; }
        break; }
      case 'dev': drag.d.x=p.x-drag.dx; drag.d.y=p.y-drag.dy; drag.moved=true;
        s.querySelector(`[data-dev="${drag.d.id}"]`)?.setAttribute('transform', `translate(${drag.d.x} ${drag.d.y})`); break;
      case 'room': { const dx=p.x-drag.sx, dy=p.y-drag.sy; drag.rm.x=drag.rx+dx; drag.rm.y=drag.ry+dy; drag.inside.forEach(o=>{o.d.x=o.x+dx; o.d.y=o.y+dy;}); drag.moved=true; renderLayers(); break; }
      case 'resize': { const m=R(plan()); drag.rm.w=Math.max(m*2, p.x-drag.ox-drag.rm.x); drag.rm.h=Math.max(m*2, p.y-drag.oy-drag.rm.y); drag.moved=true; renderLayers(); break; }
      case 'newroom': { const r=$('#tmpLayer rect'); r.setAttribute('x',Math.min(p.x,drag.x0)); r.setAttribute('y',Math.min(p.y,drag.y0)); r.setAttribute('width',Math.abs(p.x-drag.x0)); r.setAttribute('height',Math.abs(p.y-drag.y0)); drag.p=p; break; }
    }
  });
  const end = () => {
    if(!drag) return;
    const P = plan();
    if(drag.kind==='newroom'){
      $('#tmpLayer').innerHTML='';
      const p = drag.p, m = R(P);
      if(p && Math.abs(p.x-drag.x0)>m && Math.abs(p.y-drag.y0)>m){
        const rm = {id:uid(), x:Math.min(p.x,drag.x0), y:Math.min(p.y,drag.y0), w:Math.abs(p.x-drag.x0), h:Math.abs(p.y-drag.y0), name:tx`Rum ${P.rooms.length+1}`};
        P.rooms.push(rm); save(); setMode('select'); select({kind:'room', id:rm.id});
        const inp=$('#roomName'); if(inp){ inp.focus(); inp.select(); }
      }
    } else if(drag.moved){
      if(drag.d) drag.d.updated = Date.now();
      save(); renderList(); if(cur.sel) renderPanel();
    }
    s.classList.remove('panning'); drag = null;
  };
  s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end);

  document.addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
    if($('#modal').hidden && (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing))){
      e.preventDefault(); if(PAGE || VIEW === 'dash') setView('devices'); const sb = $('#search'); sb.focus(); sb.select(); return;
    }
    if(e.key==='Escape'){
      if(!$('#modal').hidden) return;
      if(PAGE){ if(typing) document.activeElement.blur(); else if(gBack && !$('#gDlg').hidden) navTo(gBack); else closePage(); return; }
      if(typing) document.activeElement.blur(); else { setMode('select'); if(cur.sel) select(null); }
    }
    if((e.key==='Delete') && !typing) delSelected();
    if((e.ctrlKey || e.metaKey) && !typing && $('#modal').hidden){
      const k = e.key.toLowerCase();
      if(k === 'z' && !e.shiftKey){ e.preventDefault(); undoRedo(-1); }
      else if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); undoRedo(1); }
    }
  });

  /* Autolås */
  let last = Date.now();
  ['pointerdown','keydown','wheel'].forEach(ev => document.addEventListener(ev, ()=>last=Date.now(), {passive:true}));
  setInterval(() => { if(Date.now()-last > AUTOLOCK_MIN*60000) lock(); }, 30000);
}

document.querySelectorAll('i[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
document.body.dataset.view = VIEW;
if(lsGet('itinv.ui.navmin') === '1') document.body.classList.add('navmin');
if(lsGet('itinv.ui.list') === '0' || (!lsGet('itinv.ui.list') && innerWidth < 1400)) document.body.classList.add('nolist');
tickClock(); setInterval(tickClock, 1000);
start();
</script>
</body>
